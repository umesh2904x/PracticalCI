name: Simple CI Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Environment
      run: |
        echo "Running on Ubuntu OS..."
        uname -a

    - name: Success Build Message
      run: |
        echo "========================================="
        echo "🚀 SUCCESS: Build completed successfully!"
        echo "Repository: umesh2904x"
        echo "Environment: Ubuntu Latest"
        echo "========================================="
